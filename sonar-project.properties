# SonarQube Project Identification
sonar.projectKey=ecommerce-microservices
sonar.projectName=E-Commerce Microservices Platform
sonar.projectVersion=1.0.0

# Source & Test Code Directories
sonar.sources=api-gateway/src/main/java,product-service/src/main/java,order-service/src/main/java,payment-service/src/main/java,discovery-server/src/main/java
sonar.tests=product-service/src/test/java,order-service/src/test/java,payment-service/src/test/java
sonar.java.binaries=**/target/classes

# JaCoCo XML Coverage Reports
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# Encodings & Exclusions
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/model/**,**/dto/**,**/config/**
sonar.coverage.exclusions=**/model/**,**/dto/**,**/config/**,**/*Application.java
